  catalog_pass_rate: 0.0
  facet: contract_quality
  points: 2
  baseline_pass_rate: 0.006
- feature: mcp-generation
  check: mcp_server
  layer: agent_readiness
  grade: documented
  provider_must: >-
    Publish the generated server and declare it. Reaching `verified` means deploying it over HTTP on a
    host the provider operates, where a probe can enumerate its tools.
  note: >-
    The default output is an npm package run over stdio, which no probe can reach, so it is graded as
    documented (0.4). The tools are generated per operation from the provider's own OpenAPI, so the tool
    shape is not shared across customers and should not cluster as `platform`. The feature is alpha and
    access is by request.
  points: 12
  baseline_pass_rate: 0.22
- feature: sdk-generation
  check: openapi_examples
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    The check reads request and response examples in the OpenAPI first. SDK code samples in the portal
    reach only the Examples / Code Samples link fallback (0.25), and only once that link is declared.
  points: 7
  baseline_pass_rate: 0.36
earns_nothing:
- feature: validation-linting
  check: examples_present
  why: >-
    The linter flags a missing parameter example as information and does not write one. SDK code samples
    are not request or response examples in the contract.
- feature: validation-linting
  check: rules_present
  why: >-
    The 1000+ rules are APIMatic's own ruleset inside its tooling. The check reads a ruleset the provider
    publishes.
- feature: apimatic-skills
  check: agent_skill_present
  why: >-
    These skills teach an agent to operate APIMatic. They say nothing about the customer's API and do
    not belong on its surface.
- feature: sdk-pagination-retries
  check: idempotency
  layer: agent_readiness
  why: >-
    SDK retry and pagination helpers do not add an idempotency key to the contract. The dimension reads
    the OpenAPI.
- feature: sdk-generation
  check: error_semantics
  layer: agent_readiness
  why: >-
    Typed SDK errors are built from whatever error schemas the contract already has. Generation does not
    add a shared error schema.
out_of_reach:
  checks:
  - openapi_3_2
  - cli_present
  - status_page_present
  - rate_limits_documented
  - plans_present
  - well_known_published
  - agent_card
  - auth_clarity
  - agent_skills
  note: >-
    APIMatic does not generate a CLI for the customer's API, runs no status or plans surface, serves no
    .well-known documents, and ships no Agent Skill for the customer's API. The skills it publishes are
    about APIMatic itself.
unscored_practice:
- feature: context-plugins
  why: >-
    A plugin repository that a coding agent loads (API reference, auth, SDK code). No check reads a coding-agent
    plugin, and it lives in a GitHub repository, not on the provider's API surface.
- feature: portal-llms-txt
  why: Per-page Markdown twins under /llms-pages/. The rubric has no markdown-twin check.
