# Vendor facets — APIMatic. An SDK generator, API Transformer, linter and developer portal driven
# from one OpenAPI. The headline: it is the rare vendor that can reach Contract Quality, but only by
# converting a non-OpenAPI description or by the provider acting on lint findings. Linting reports,
# it does not write descriptions, so most contract rows are conditional. Its embedded portal widget
# ships a client-side-rendered shell, and its output leaves almost no fingerprint on the customer.
vendor: apimatic
name: APIMatic
website: https://www.apimatic.io
areas:
- developer-portal
- sdk-generation
registry_keys:
- apimatic
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  APIMatic's surest lift is Developer Ergonomics: SDKs in seven languages and a portal with an API reference,
  guides, a playground and a changelog. Each of those counts only once the provider declares it in its
  apis.yml. It can also reach Contract Quality, which a docs-only vendor cannot, but only where the API
  Transformer converts a WSDL, RAML or Postman description into the first published OpenAPI, or where
  the provider acts on what the linter flags. The linter reports gaps and does not fill them. The embedded
  portal widget serves a client-side shell with no content in its HTML (re-checked on a Verizon ThingSpace
  page on 2026-09-25). APIMatic output rarely carries an APIMatic fingerprint on the customer's own surface,
  so its customer base cannot be measured.
features:
- id: sdk-generation
  name: SDK generation in seven languages
  description: >-
    Idiomatic client SDKs for Java, Python, TypeScript, Ruby, C#, PHP and Go generated from one OpenAPI,
    published to package registries.
  source: https://www.apimatic.io/
  tier: paid
- id: developer-portal
  name: API developer portal
  description: >-
    A generated portal with language-specific API reference, custom Markdown guides, SDK guides, auth
    setup and analytics, hosted as its own project or embedded in an existing docs site.
  source: https://docs.apimatic.io/publish-apis/api-portal-overview/
  tier: paid
- id: api-playground
  name: Live API playground
  description: An in-portal console that calls an endpoint with live input validation.
  source: https://docs.apimatic.io/publish-apis/api-portal-overview/
  tier: paid
- id: api-recipes
  name: API Recipes
  description: Step-by-step onboarding flows rendered in the portal.
  source: https://www.apimatic.io/
  tier: paid
- id: portal-changelog
  name: Portal changelog integration
  description: Changelog pages as part of the documentation portal.
  source: https://docs.apimatic.io/
  tier: paid
- id: portal-llms-txt
  name: Portal llms.txt, llms-full.txt and per-page Markdown
  description: >-
    The portal generates llms.txt and llms-full.txt that point to page-level Markdown documents served
    under /llms-pages/, revamped in May 2026.
  source: https://docs.apimatic.io/changelog/revamped-llm-context-files-and-added-per-page-markdown-exports/
  tier: paid
- id: api-transformer
  name: API Transformer
  description: >-
    Converts 10+ description formats (WSDL, WADL, RAML, API Blueprint, Postman, Insomnia, HAR, Google
    Discovery) to OpenAPI 3.1, 3.0 or 2.0, or to a Postman 2.0 collection.
  source: https://docs.apimatic.io/api-transformer/overview-transformer/
  tier: all
- id: validation-linting
  name: Validation and linting (1000+ rules)
  description: >-
    Syntax and semantic validation plus lint suggestions (for example a missing endpoint description or
    parameter example), reported in the VS Code extension, with one-click auto-fix for some rule violations.
  source: https://docs.apimatic.io/validate-lint-apis/overview/
  tier: all
- id: lint-auto-fix
  name: VS Code auto-fix for rule violations
  description: Applies a fix to one instance or all instances of a flagged rule violation.
  source: https://www.apimatic.io/blog/product-highlights-july-2025
  tier: all
- id: mcp-generation
  name: MCP server generation (alpha)
  description: >-
    Generates a per-operation MCP server from the OpenAPI on top of the TypeScript SDK, distributed as
    an npm package for stdio or self-hosted HTTP use.
  source: https://docs.apimatic.io/generate-mcp-servers/mcp-server-overview/
  tier: unknown
- id: context-plugins
  name: Context Plugins
  description: >-
    Version-aware API context for coding agents (the API reference, auth requirements, versioned SDK code
    and samples), published to a public GitHub repository by `apimatic plugin publish`.
  source: https://docs.apimatic.io/context-plugins/overview/
  tier: paid
- id: apimatic-skills
  name: APIMatic Agent Skills
  description: >-
    SKILL.md files that teach a coding agent how to use APIMatic (build a portal, generate SDKs). They
    are not generated for the customer's API.
  source: https://docs.apimatic.io/skills/overview/
  tier: open-source
- id: sdk-pagination-retries
  name: SDK pagination and retry helpers
  description: >-
    Unified pagination driven by an x-pagination extension, plus retry with exponential backoff in the
    new C# generator.
  source: https://www.apimatic.io/blog/may-2026-product-highlights
  tier: paid
