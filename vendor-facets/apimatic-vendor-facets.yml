    The provider has to publish the output.
  creates_artifact: true
  note: >-
    The one case where APIMatic creates the artifact class that makes Contract Quality applicable at all.
  catalog_pass_rate: 0.31
  facet: contract_quality
  points: 20
  baseline_pass_rate: 0.949
  saturated: true
  saturated_note: >-
