note: >-
  The APIMatic Platform API is a job-oriented model, not a CRUD graph. One durable root entity —
  the API Entity — owns a set of generation jobs (SDK, portal, transformation, validation), each
  of which is created, polled for status, and downloaded. The entity graph below is derived from
  the captured contract's schemas and path parameters plus the first-party SDK model reference;
  entities marked `source: sdk-docs` are documented by APIMatic but absent from any fetchable
  specification, so they are recorded as evidence rather than as contract.
root_entity: ApiEntity
entities:
  - name: ApiEntity
    id_field: id
    id_in_path: apiEntityId
    description: An API definition imported into an APIMatic account. The root of everything else.
    source: openapi
    fields: [id, name, description, version, createdAt, updatedAt]
    required: [id, name]
  - name: SdkGenerationRequest
    description: The instruction to generate an SDK — a target platform enum.
    source: openapi
    fields: [platform]
