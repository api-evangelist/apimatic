  - name: SdkGenerationResult
    description: The outcome of an SDK generation — a signed, expiring download URL.
    source: openapi
    fields: [downloadUrl, expiresAt]
    note: >-
      `expiresAt` is the one time-bounded field in the captured contract. The docs state no
      duration, so the window is observable per response but not published.
