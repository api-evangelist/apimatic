components:
  schemas:
    UnauthorizedResponse:
      title: UnauthorizedResponse
      type: object
      additionalProperties:
        type: object
      properties:
        message:
          example: Authorization has been denied for this request.
          type: string
    ProblemDetails:
      title: ProblemDetails
      type: object
      additionalProperties:
        type: object
      properties:
        type:
          example: https://tools.ietf.org/html/rfc7231#section-6.5.1
          type: string
        title:
          example: One or more validation errors occurred.
          type: string
        status:
          example: 400
          type: integer
          format: int32
        detail:
          example: One or more validation failures have occurred
          type: string
        instance:
          example: /api/portal
          type: string
        errors:
          example:
            ? ''
            : - Build file not found
          type: object
          additionalProperties:
            type: object
    InternalServerErrorResponse:
      title: InternalServerErrorResponse
      type: object
      additionalProperties:
        type: object
      properties:
        message:
          example: An error has occurred.
          type: string
    ValidateApiResult:
      title: ValidateApiResult
      type: object
      additionalProperties:
        type: object
      properties:
        validation:
          $ref: '#/components/schemas/ValidationSummary'
        linting:
          $ref: '#/components/schemas/ValidationSummary'
      required:
      - validation
      - linting
    ValidationEntry:
      title: ValidationEntry
      type: object
      additionalProperties:
        type: object
      properties:
        message:
          type: string
        lineInfo:
          $ref: '#/components/schemas/LineInfo'
        jsonReferencePath:
          type: string
        fileReference:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        ruleDocumentationReference:
          type: string
        additionalReferences:
          description: ''
          type: array
          items:
            type: string
      required:
      - message
    LineInfo:
      title: LineInfo
      type: object
      additionalProperties:
        type: object
      properties:
        startLineNumber:
          type: integer
          format: int32
        startLinePosition:
          type: integer
          format: int32
        endLineNumber:
          type: integer
          format: int32
        endLinePosition:
          type: integer
          format: int32
      required:
      - startLineNumber
      - startLinePosition
      - endLineNumber
      - endLinePosition
    ValidationSummary:
      title: ValidationSummary
      type: object
      additionalProperties:
        type: object
      properties:
        isSuccess:
          type: boolean
        blocking:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/ValidationEntry'
        errors:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/ValidationEntry'
        warnings:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/ValidationEntry'
        information:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/ValidationEntry'
      required:
      - isSuccess
      - blocking
      - errors
      - warnings
      - information
  securitySchemes:
    Authorization:
      type: apiKey
      in: header
      name: Authorization
      description: 'Auth Header. Replace {x-auth-key} with your Auth Key. Header value form: `X-Auth-Key {x-auth-key}`.'
      x-source: https://docs.apimatic.io/platform-api/static/docs/apimatic-api-HTTP_CURL_V1.json
