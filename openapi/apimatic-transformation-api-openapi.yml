              schema:
                type: string
                format: binary
      security:
      - Authorization: []
      x-source: https://docs.apimatic.io/platform-api/static/docs/apimatic-api-HTTP_CURL_V1.json
      x-docs-title: API Endpoints > Transformation > Download Transformed File > Download Transformed File
      x-evidence:
        kind: documentation
  /transformations/{transformation_id}/input-file:
    get:
      operationId: downloadInputFile
      summary: Download Input File
      description: Download the API Specification file used as input for a particular Transformation performed via the Transformation endpoints.
      tags:
      - Transformation
      parameters:
      - name: transformation_id
        in: path
        required: true
        description: The ID of the transformation to download the API specification for. The transformation ID is received in the response of the [Transform Via File ]($e/Transformation/Transform%20via%20File) or [Transform Via URL]($e/Transformation/Transform%20via%20URL) calls.
