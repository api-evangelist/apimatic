paths:
  /transformations/transform-via-file:
    post:
      operationId: transformViaFile
      summary: Transform via File
      description: 'Transform an API into any of the supported API specification formats by uploading the API specification file.


        This endpoint transforms and then uploads the transformed API specification to APIMatic''s cloud storage. An ID for the transformation performed is returned as part of the response.'
      tags:
      - Transformation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The API specification file.<br>The type of the specification file should be any of the [supported formats](https://docs.apimatic.io/api-transformer/overview-transformer#supported-input-formats).
                export_format:
                  $ref: '#/components/schemas/ExportFormats'
                  description: The structure contains API specification formats that Transformer can convert to.
              required:
              - file
              - export_format
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transformation'
      security:
      - Authorization: []
      x-source: https://docs.apimatic.io/platform-api/static/docs/apimatic-api-HTTP_CURL_V1.json
      x-docs-title: API Endpoints > Transformation > Transform via File > Transform via File
      x-evidence:
        kind: documentation
  /transformations/transform-via-url:
    post:
      operationId: transformViaUrl
      summary: Transform via URL
      description: 'Transform an API into any of the supported API specification formats by providing the URL of the API specification file.


        This endpoint transforms and then uploads the transformed API specification to APIMatic''s cloud storage. An ID for the transformation performed is returned as part of the response.'
      tags:
      - Transformation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformViaUrlRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transformation'
      security:
      - Authorization: []
      x-source: https://docs.apimatic.io/platform-api/static/docs/apimatic-api-HTTP_CURL_V1.json
      x-docs-title: API Endpoints > Transformation > Transform via URL > Transform via URL
      x-evidence:
        kind: documentation
  /transformations/{transformation_id}/converted-file:
    get:
      operationId: downloadTransformedFile
      summary: Download Transformed File
      description: Download the transformed API specification file transformed via the Transformation endpoints.
      tags:
      - Transformation
      parameters:
      - name: transformation_id
        in: path
        required: true
        description: The ID of transformation received in the response of the [Transform Via File ]($e/Transformation/Transform%20via%20File) or [Transform Via URL  ]($e/Transformation/Transform%20via%20URL) calls.
        schema:
          type: string
      responses:
        '200':
