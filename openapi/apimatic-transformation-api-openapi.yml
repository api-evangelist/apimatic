components:
  schemas:
    Transformation:
      title: Transformation
      description: Transformation structure encapsulates all the details of a Transformation.
      type: object
      additionalProperties:
        type: object
      properties:
        id:
          description: Unique Transformation Identifier
          example: 5be0999183b41d0d8cdb9f26
          type: string
        transformedOn:
          description: Transformation Date and Time
          example: 11/5/2018 7:27:13 PM
          type: string
        userId:
          description: Unique User Identifier
          example: 5afc60380b9949253c6b7776
          type: string
        inputtedFile:
          description: API Specification file to be transformed
          example: https://api.apimatic.io/transformations/5be0999183b41d0d8cdb9f26/input-file
          type: string
        generatedFile:
          description: API Specification file transformed to desired format
          example: https://api.apimatic.io/transformations/5be0999183b41d0d8cdb9f26/converted-file
          type: string
        exportFormat:
          description: Desired Specification format
          example: APIMATIC
          type: string
        transformationSource:
          description: Source of Transformation
          example: Api
          type: string
        transformationInput:
          description: Via File or URL
          example: File
          type: string
        codeGenVersion:
          description: CodeGen Engine Version
          example: '1'
          type: string
        success:
          description: Successful Transformation Flag
          example: true
          type: boolean
        importSummary:
          $ref: '#/components/schemas/ApiValidationSummary'
        apiValidationSummary:
          $ref: '#/components/schemas/ApiValidationSummary'
      required:
      - id
      - transformedOn
      - userId
      - inputtedFile
      - generatedFile
      - exportFormat
      - transformationSource
      - transformationInput
      - codeGenVersion
      - success
      - importSummary
      - apiValidationSummary
    TransformViaUrlRequest:
      title: TransformViaUrlRequest
      description: This structure puts together the URL of the file to be transformed, along with the desired export format.
      type: object
      additionalProperties:
        type: object
      properties:
        url:
          description: The URL for the API specification file.<br><br>**Note:** This URL should be publicly accessible.
          example: https://petstore.swagger.io/v2/swagger.json
          type: string
        export_format:
          $ref: '#/components/schemas/ExportFormats'
      required:
      - url
      - export_format
    ExportFormats:
      title: ExportFormats
      description: The structure contains API specification formats that Transformer can convert to.
      example: APIMATIC
      x-enum-elements:
      - name: APIMATIC
        description: ''
      - name: WADL2009
        description: ''
      - name: WSDL
        description: ''
      - name: SWAGGER10
        description: ''
      - name: SWAGGER20
        description: ''
      - name: SWAGGERYAML
        description: ''
      - name: OAS3
        description: OpenAPI v3.0 (JSON)
      - name: OPENAPI3YAML
        description: ''
      - name: APIBLUEPRINT
        description: ''
      - name: RAML
        description: ''
      - name: RAML10
        description: ''
      - name: POSTMAN10
        description: ''
      - name: POSTMAN20
        description: ''
      - name: GRAPHQLSCHEMA
        description: ''
      type: string
      additionalProperties: false
      enum:
      - APIMATIC
      - WADL2009
      - WSDL
      - Swagger10
      - Swagger20
      - SwaggerYaml
      - OpenApi3Json
      - OpenApi3Yaml
      - APIBluePrint
      - RAML
      - RAML10
      - Postman10
      - Postman20
      - GraphQlSchema
