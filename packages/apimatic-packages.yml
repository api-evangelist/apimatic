method: searched
source: |-
  Public registry metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org,
  repo.packagist.org, api.nuget.org, search.maven.org, proxy.golang.org) plus the
  APIMatic GitHub organisation (https://github.com/apimatic) and
  https://docs.apimatic.io/generate-sdks/sdk-publishing/sdk-publishing-overview/
note: >-
  APIMatic publishes two distinct families of first-party packages, and conflating them
  misreads the company. (1) API CLIENTS for APIMatic's OWN Platform API — @apimatic/sdk
  (the generated TypeScript client) and @apimatic/cli (the official CLI). (2) SDK RUNTIME
  libraries that ship inside the SDKs APIMatic GENERATES FOR ITS CUSTOMERS — core, schema,
  http-query, unirest-php, jsonmapper and friends. Both are first-party and both are real
  decay evidence, but only family (1) tells you whether a consumer can call the APIMatic
  Platform API today. Each entry carries `role:` to keep them apart.
packages:
  # --- Clients for the APIMatic Platform API itself -------------------------------------
  - language: javascript
    registry: npm
    name: "@apimatic/sdk"
    role: api-client
    url: https://www.npmjs.com/package/@apimatic/sdk
    repo: https://github.com/apimatic/apimatic-sdk-for-js
    install: npm install @apimatic/sdk
    official: true
    version: 0.2.0-alpha.10
    published: '2026-05-15'
    note: >-
      The only first-party client for APIMatic's own Platform API ON A PACKAGE REGISTRY
      (re-profiled 2026-09-23: five more languages ship from the portal, below). Still on an alpha
      dist-tag; its 13 controllers (APIs Management, Transformation, SDK Generation Async,
      Docs Portal Generation Async, V2 SDK Generation, API Validation, Table of Contents,
      SDK Source Tree Generation) are a far wider operation surface than any spec APIMatic
      publishes at a fetchable URL.
