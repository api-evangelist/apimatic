headline: 'Of the nine tools across APIMatic''s three MCP servers, exactly one calls a Platform API operation: the
  local validator''s validate-openapi-using-apimatic, which calls POST /transformations/transform-via-file. The
  hosted integration agent and ContextMatic are copilot/retrieval tools over generated SDK documentation. An agent
  connected to them can ask how to integrate; it cannot generate an SDK, run a transformation or publish a portal.'
