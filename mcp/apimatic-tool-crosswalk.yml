crosswalk:
- tool: validate-openapi-using-apimatic
  category: validation
  rest:
  - transformViaFile
  binding: direct — the server calls TransformationController.transformViaFile with ExportFormats.APIMATIC and returns
    importSummary
  confidence: high
  note: Named "validate" but bound to the Transformation endpoint, not /validation/*. Read from the server source.
mcp_only:
- tool: ask
  reason: Retrieval-augmented copilot over the portal's own documentation and generated SDK. No REST operation backs
    it; it returns integration steps, not API results.
- tool: update_activity
  reason: Server-side session telemetry (integration milestone). Has no public REST equivalent.
- tool: model_search
  reason: Documentation lookup over generated SDK model definitions. The closest REST relative is downloading the
    API specification, which is a different capability and a different shape.
- tool: endpoint_search
  reason: Documentation lookup over generated SDK endpoint signatures. Same note as model_search.
- tool: fetch_api
  reason: 'ContextMatic: lists or matches third-party APIs in APIMatic''s curated catalog. No Platform API operation
    backs it.'
- tool: ask (context-matic)
  reason: ContextMatic API Copilot chat over third-party SDK docs. No REST operation backs it.
- tool: endpoint_search (context-matic)
  reason: ContextMatic SDK endpoint-signature lookup for third-party APIs.
- tool: model_search (context-matic)
  reason: ContextMatic SDK model-definition lookup for third-party APIs.
