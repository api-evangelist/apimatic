headline: >-
  APIMatic's hosted MCP server is NOT a wrapper over its REST operations. All four published
  tools are copilot/retrieval tools over the generated SDK's documentation; none of them calls
  an APIMatic Platform API operation. An agent that connects to this server can ask how to
  integrate, and can look up a model or an endpoint signature — it cannot import an API, run a
  transformation, generate an SDK or publish a portal. Recording that divergence is the point
  of this file.
